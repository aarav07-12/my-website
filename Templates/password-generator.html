<!DOCTYPE html>
<html>

<head>

    <title>Password Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MY PORTFOLIO
        </div>

        <div class="nav-links">

            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/projects">Projects</a>
            <a href="/contact">Contact</a>
            <a href="/login">Login</a>

        </div>

    </nav>


    <section class="calculator-page">

        <div class="calculator-card password-card">

            <h1>🔐 Password Generator</h1>

            <p>
                Create a random password in seconds!
            </p>


            <form method="POST">

                <label for="length">
                    Password Length
                </label>

                <input
                    type="number"
                    id="length"
                    name="length"
                    min="6"
                    max="50"
                    value="12"
                    required
                >


                <button type="submit">
                    🔑 Generate Password
                </button>

            </form>


            {% if password %}

            <div class="password-result">

                <h2>Your Password</h2>

                <div class="password-box">

                    <span id="password">
                        {{ password }}
                    </span>

                    <button
                        type="button"
                        onclick="copyPassword()"
                        class="copy-btn"
                    >
                        📋 Copy
                    </button>

                </div>

                <p id="copy-message"></p>

            </div>

            {% endif %}


            <a href="/python-projects"
               class="back-projects">

                ← Back to Python Projects

            </a>

        </div>

    </section>


    <footer>

        <p>
            © 2026 My Portfolio | Built with Python 🐍
        </p>

    </footer>


    <script>

        function copyPassword() {

            const password =
                document.getElementById("password").innerText;

            navigator.clipboard.writeText(password);

            document.getElementById("copy-message").innerText =
                "✅ Password copied!";

        }

    </script>

</body>

</html>
